<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Trajet Livraison</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    #map { height: 100vh; width: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    // 🧭 Lire les paramètres de l’URL
    const params = new URLSearchParams(window.location.search);
    const endLat = parseFloat(params.get("endLat")) || 36.8; // Valeur par défaut
    const endLng = parseFloat(params.get("endLng")) || 10.2; // Valeur par défaut

    // 📍 Point de départ fixe (ex: dépôt)
    const start = [36.794, 10.073]; // Tunis exemple

    const map = L.map("map").setView(start, 12);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap"
    }).addTo(map);

    const startMarker = L.marker(start).addTo(map).bindPopup("Dépôt");
    const endMarker = L.marker([endLat, endLng]).addTo(map).bindPopup("Destination");

    // 🔁 Tracer la route via OpenRouteService
    const apiKey = "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImViZjc4NTg4YzgxYTQxNGE5N2E3Y2RmOTFiMTVmMDU3IiwiaCI6Im11cm11cjY0In0="; // Remplace par ta vraie clé
    const url = `https://api.openrouteservice.org/v2/directions/driving-car?api_key=${apiKey}&start=${start[1]},${start[0]}&end=${endLng},${endLat}`;

    fetch(url)
      .then(response => response.json())
      .then(data => {
        const coords = data.features[0].geometry.coordinates.map(c => [c[1], c[0]]);
        L.polyline(coords, {color: 'blue'}).addTo(map);
        map.fitBounds([start, [endLat, endLng]]);
      })
      .catch(err => console.error(err));
  </script>
</body>
</html>
